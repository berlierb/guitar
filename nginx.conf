server {
    listen 80;
    server_name guitar.color-and-learn.com;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;

    location ~ /\.git {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
