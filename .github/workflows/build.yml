name: build-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un seul build à la fois par branche : un push plus récent annule le précédent.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Aucun droit par défaut ; chaque job déclare le strict nécessaire.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # lire le code
      packages: write   # publier l'image sur GHCR
    steps:
      # Chaque action est épinglée par le hash de son commit (un tag comme @v7 peut être
      # déplacé après coup). Dependabot propose les mises à jour par pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Connexion au registre seulement sur un push : une pull request construit l'image
      # sans jamais la publier.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Un tag = le commit (7 caractères), jamais « latest ».
          tags: type=sha,format=short,prefix=

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Résumé
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image publiée"
            echo "- Tag : \`${TAG}\`"
            echo "- Digest : \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
